name: Deploy frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/vercel-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
